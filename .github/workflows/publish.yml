name: Publish npm package

# 自动发布：推送符合 v* 的 tag（如 v0.2.1）时触发；
# 也可在 Actions 页面手动点 “Run workflow”。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 用于 npm 的 provenance（可选，去掉则不需要）
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 必须用 node 24（自带 npm 11.x）：npm 10.x 不支持 OIDC 受信发布，
          # 会因 .npmrc 里的空 _authToken 走错路径导致发布 404。
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 纯源码包无 build 步骤：npm publish 仅打包 files 字段，
      # 不需要安装依赖，因此不跑 npm ci，也不提交 lockfile。

      # 仅 tag 触发时校验版本一致；手动 dispatch（分支触发）时跳过，
      # 避免把分支名当版本号误判失败。
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} pkg=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::Tag 'v${TAG}' does not match package.json version '${PKG}'"
            exit 1
          fi

      - name: Publish to npm
        # npm Trusted Publishing（OIDC 受信发布）：不设置 NODE_AUTH_TOKEN，
        # npm 读取 GitHub Actions 的环境 OIDC token 自动授权发布。
        # 需在 npm 侧将 hotsnow-sean/pi-zero 配置为受信发布方。
        run: npm publish --provenance --access public
