name: Publish npm package

# 自动发布：推送符合 v* 的 tag（如 v0.2.1）时触发；
# 也可在 Actions 页面手动点 “Run workflow”。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 用于 npm 的 provenance（可选，去掉则不需要）
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'            # 满足 engines: >=22.19.0
          registry-url: 'https://registry.npmjs.org'

      # 纯源码包无 build 步骤：npm publish 仅打包 files 字段，
      # 不需要安装依赖，因此不跑 npm ci，也不提交 lockfile。

      # 仅 tag 触发时校验版本一致；手动 dispatch（分支触发）时跳过，
      # 避免把分支名当版本号误判失败。
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} pkg=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::Tag 'v${TAG}' does not match package.json version '${PKG}'"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
